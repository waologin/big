<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>テスト</title>
</head>
<body>
  <h2>Push通知テスト</h2>
  <button id="btn">通知を許可して購読情報を取得</button>

  <pre id="result" style="background:#222;color:#0f0;padding:10px;border-radius:8px;max-width:90%;overflow:auto;"></pre>

  <script type="module">
    const VAPID_PUBLIC_KEY_BASE64URL = "ここにあなたのVAPID公開鍵を貼ってください"; // base64url形式（例: BMxxx）

    document.getElementById("btn").addEventListener("click", async () => {
      const resultEl = document.getElementById("result");
      try {
        const sub = await requestPushSubscription();
        console.log("購読情報:", sub);
        resultEl.textContent = JSON.stringify(sub, null, 2);
      } catch (err) {
        console.error(err);
        resultEl.textContent = "❌ エラー: " + err.message;
      }
    });

    async function requestPushSubscription(serviceWorkerPath = "/sw.js") {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        throw new Error("このブラウザはPush通知に対応していません");
      }

      // 1️⃣ Service Worker登録
      const registration = await navigator.serviceWorker.register(serviceWorkerPath);

      // 2️⃣ 通知許可リクエスト
      const permission = await Notification.requestPermission();
      if (permission !== "granted") throw new Error("通知が許可されませんでした");

      // 3️⃣ 購読情報の取得・作成
      const existingSub = await registration.pushManager.getSubscription();
      if (existingSub) return existingSub.toJSON();

      const appServerKey = urlBase64ToUint8Array(VAPID_PUBLIC_KEY_BASE64URL);
      const newSub = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: appServerKey,
      });
      return newSub.toJSON();
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }
  </script>
</body>
</html>
