<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A端末テスト</title>
  <style>
    body { font-family: monospace; background: #fafafa; padding: 20px; }
    pre { background: #111; color: #0f0; padding: 10px; height: 60vh; overflow-y: auto; border-radius: 6px; }
    button { padding: 10px 16px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>📡 A端末 - QR発行テスト</h2>
  <button id="startA">ハンドシェイク開始</button>
  <pre id="log"></pre>
  <div id="qr"></div>

  <script type="module">
    const logEl = document.getElementById("log");
    const qrEl = document.getElementById("qr");
    const btn = document.getElementById("startA");

    function log(msg, data) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${msg}\n`;
      if (data) logEl.textContent += JSON.stringify(data, null, 2) + "\n";
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg, data ?? "");
    }

    btn.addEventListener("click", async () => {
      log("🟡 ボタン押下検知。モジュール読み込み開始...");
      try {
        const { startHandshakeA } = await import("./src/main/A_side.js");
        if (!startHandshakeA) throw new Error("startHandshakeA が読み込めませんでした。");
        log("✅ モジュール読み込み成功。関数実行開始。");
        const result = await startHandshakeA(log);
        log("✅ ハンドシェイク完了！", result);
        if (result?.qrCanvas) qrEl.appendChild(result.qrCanvas);
      } catch (err) {
        log("❌ エラー: " + err.message);
        alert("エラー: " + err.message);
        console.error(err);
      }
    });
  </script>
</body>
</html>
