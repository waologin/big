<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Push Test</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <h1>🔐 Secure Push Test</h1>

  <button id="btn-register">通知登録</button>
  <button id="btn-send">テスト送信</button>

  <pre id="log"></pre>

  <script type="module">
    import { secureSendPush } from './js/secureSendPush.js';
    import { SERVER_API_URL } from './js/constants.js';

    const log = (msg) => {
      const pre = document.getElementById("log");
      pre.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
    };

    // Service Worker 登録
    navigator.serviceWorker.register('sw.js').then(() => {
      log("ServiceWorker registered.");
    });

    // 通知登録
    document.getElementById('btn-register').onclick = async () => {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        return log("通知許可が必要です。");
      }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array('<VAPID公開鍵>')
      });
      localStorage.setItem("subscription", JSON.stringify(sub.toJSON()));
      log("通知登録完了。");
    };

    // テスト送信
    document.getElementById('btn-send').onclick = async () => {
      const sub = JSON.parse(localStorage.getItem("subscription"));
      if (!sub) return log("通知登録が未完了。");

      const payload = {
        senderId: "alice",
        recipientId: "bob",
        message: "テストメッセージ from client"
      };

      const res = await secureSendPush(payload, sub);
      log(`送信完了: ${res.status}`);
    };

    // Base64 helper
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }
  </script>
</body>
</html>
