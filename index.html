<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Pushテスト</title>
</head>
<body>
  <button id="btnRegister">🔔 通知登録</button>
  <button id="btnSend">📨 メッセージ送信</button>

  <script type="module">
    import { requestNotificationPermission } from "./requestNotificationPermission.js";
    import { secureSendPush } from "./secureSendPush.js";

    let subscription = null;

    // --- 通知登録ボタン ---
    document.getElementById("btnRegister").addEventListener("click", async () => {
      try {
        console.log("🔄 通知登録中...");
        subscription = await requestNotificationPermission();
        console.log("✅ 通知購読成功:", subscription);
      } catch (err) {
        console.error("❌ 通知登録失敗:", err);
      }
    });

    // --- メッセージ送信ボタン ---
    document.getElementById("btnSend").addEventListener("click", async () => {
      if (!subscription) {
        console.warn("⚠️ 先に通知登録してください。");
        return;
      }

      const params = {
        senderId: "alice",
        recipientId: "bob",
        message: "テストメッセージ from browser"
      };

      try {
        console.log("📤 送信中...");
        const res = await secureSendPush(params, subscription);
        console.log("✅ サーバ応答:", await res.text());
      } catch (err) {
        console.error("❌ エラー:", err);
      }
    });
  </script>
</body>
</html>
