<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Push送信テスト</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <h1>中継サーバー Push送信テスト</h1>
  <button id="reqPermission">通知権限リクエスト</button>
  <button id="sendTest">テスト送信</button>
  <pre id="output"></pre>

  <script type="module">
    import { secureSendPush } from "./src/utils/secureSendPush.js";

    const output = document.getElementById("output");

    // SW登録
    async function registerSW() {
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.register('./sw.js');
        console.log("SW registered:", reg);
        return reg;
      } else {
        throw new Error("Service Worker not supported");
      }
    }

    // 通知権限リクエスト
    async function requestNotificationPermission() {
      const perm = await Notification.requestPermission();
      output.textContent += `通知権限: ${perm}\n`;
      return perm;
    }

    // Pushサブスクリプション取得
    async function getSubscription(reg) {
      const vapidKey = "<ここにVAPID公開鍵>"; // Base64URL形式で設定
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: vapidKey
        });
      }
      return sub.toJSON();
    }

    // テスト送信
    async function sendTest(sub) {
      const payload = {
        senderId: "alice",
        recipientId: "bob",
        message: "これはテストメッセージです！"
      };

      try {
        const res = await secureSendPush(payload, sub);
        const json = await res.json();
        output.textContent += `送信成功:\n${JSON.stringify(json, null, 2)}\n`;
      } catch (err) {
        output.textContent += `送信失敗:\n${err.message}\n`;
      }
    }

    // ボタン動作
    document.getElementById("reqPermission").onclick = async () => {
      try {
        await requestNotificationPermission();
      } catch (e) {
        output.textContent += `Error: ${e.message}\n`;
      }
    };

    document.getElementById("sendTest").onclick = async () => {
      try {
        const reg = await registerSW();
        const sub = await getSubscription(reg);
        await sendTest(sub);
      } catch (e) {
        output.textContent += `Error: ${e.message}\n`;
      }
    };
  </script>
</body>
</html>
