<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC QR Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 2rem;
    }
    #app {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 480px;
      margin: auto;
    }
    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    button.switch {
      margin: 0.25rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #007bff;
      color: white;
    }
    pre {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h2>WebRTC QR Handshake Demo</h2>
    <div>
      <button class="switch" id="btnA">Aモード</button>
      <button class="switch" id="btnB">Bモード</button>
    </div>
  </header>
  <div id="app">読み込み中...</div>

  <!-- 各モジュールを読み込み -->
  <script type="module">
    import { mountA } from './src/main/A_side.js';
    import { mountB } from './src/main/B_side.js';

    const btnA = document.getElementById('btnA');
    const btnB = document.getElementById('btnB');

    btnA.addEventListener('click', () => mountA('app'));
    btnB.addEventListener('click', () => mountB('app'));

    // デフォルトはAをロード
    window.addEventListener('load', () => {
      mountA('app');
    });
  </script>
</body>
</html>
