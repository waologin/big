<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Web Push Test</title>
</head>
<body>
  <h2>🔔 Web Push 通知テスト</h2>

  <button id="btn-register">通知を許可＆登録</button>
  <button id="btn-send">Push送信テスト</button>

  <pre id="log"></pre>

  <script type="module">
    import { requestNotificationPermission } from "./src/utils/requestNotificationPermission.js";
    import { secureSendPush } from "./src/utils/secureSendPush.js";

    const log = (msg) => {
      console.log(msg);
      document.getElementById("log").textContent += msg + "\n";
    };

    let subscription = null;

    // ====== 1️⃣ Service Worker登録 ======
    async function registerSW() {
      if (!("serviceWorker" in navigator)) {
        log("❌ このブラウザはService Worker非対応です");
        return;
      }
      const reg = await navigator.serviceWorker.register("/service-worker.js");
      log("✅ Service Worker 登録完了");
      return reg;
    }

    // ====== 2️⃣ 通知許可＆購読情報取得 ======
    document.getElementById("btn-register").onclick = async () => {
      try {
        const reg = await registerSW();
        const result = await requestNotificationPermission(reg);
        if (result.error) {
          log("❌ 通知許可エラー: " + result.error);
          return;
        }
        subscription = result.subscription;
        log("✅ 通知購読成功");
        log(JSON.stringify(subscription, null, 2));
      } catch (err) {
        log("❌ 登録中にエラー: " + err.message);
      }
    };

    // ====== 3️⃣ Push送信テスト ======
    document.getElementById("btn-send").onclick = async () => {
      if (!subscription) {
        log("⚠️ 先に通知登録してください。");
        return;
      }
      try {
        const params = {
          senderId: "tester",
          recipientId: "me",
          message: "テスト通知です 📬"
        };
        const res = await secureSendPush(params, subscription);
        const data = await res.json();
        log("✅ Push送信結果: " + JSON.stringify(data));
      } catch (err) {
        log("❌ Push送信エラー: " + err.message);
      }
    };
  </script>
</body>
</html>
