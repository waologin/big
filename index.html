<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>通知許可テスト</title>
</head>
<body>
  <h2> 通知許可テスト</h2>
  <button id="btn-register">通知許可をリクエスト</button>
  <pre id="log"></pre>

  <script type="module">
    import { requestNotificationPermission } from "./src/utils/requestNotificationPermission.js";

    const log = (msg) => {
      console.log(msg);
      document.getElementById("log").textContent += msg + "\n";
    };

    async function registerSW() {
      if (!('serviceWorker' in navigator)) {
        log("❌ Service Worker非対応のブラウザです");
        return null;
      }
      try {
        // ✅ パスを絶対パスにして「/big/service-worker.js」を指定
        const reg = await navigator.serviceWorker.register("/big/service-worker.js");
        log("✅ Service Worker 登録成功");
        return reg;
      } catch (err) {
        log("❌ Service Worker登録失敗: " + err.message);
        return null;
      }
    }

    document.getElementById("btn-register").onclick = async () => {
      const reg = await registerSW();
      if (!reg) return;

      try {
        const result = await requestNotificationPermission(reg);
        if (result.error) {
          log("❌ 通知許可エラー: " + result.error);
        } else {
          log("✅ 通知購読成功");
          log(JSON.stringify(result.subscription, null, 2));
        }
      } catch (err) {
        log("❌ 実行エラー: " + err.message);
      }
    };
  </script>
</body>
</html>
