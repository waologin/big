<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A端末テスト</title>
  <style>
    body { font-family: monospace; background: #fafafa; padding: 20px; }
    pre { background: #111; color: #0f0; padding: 10px; height: 60vh; overflow-y: auto; border-radius: 6px; }
    button { padding: 10px 16px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>📡 A端末 - QR発行テスト</h2>
  <button id="startA">ハンドシェイク開始</button>
  <pre id="log"></pre>
  <div id="qr"></div>

  <script type="module">
  const base = location.origin + location.pathname.split("/").slice(0, -1).join("/");
  console.log("Base path:", base);

  async function safeImport(path) {
    const full = `${base}/src/main/${path}`;
    console.log("Importing:", full);
    return await import(full);
  }

  const logEl = document.getElementById("log");
  const qrEl = document.getElementById("qr");
  const btn = document.getElementById("startA");

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    logEl.textContent += `[${t}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  btn.addEventListener("click", async () => {
    log("🟡 ボタン押下 -> モジュール読み込み開始");
    try {
      const { startHandshakeA } = await safeImport("A_side.js");
      log("✅ モジュール読み込み成功");
      await startHandshakeA(log);
      log("✅ 関数実行完了");
    } catch (err) {
      log("❌ 読み込み失敗: " + err.message);
      alert("エラー: " + err.message);
    }
  });
</script>

</body>
</html>
