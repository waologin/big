<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>通知購読テスト</title>
</head>
<body>
  <h2>🔔 WebPush購読テスト</h2>
  <button id="btn">通知許可をリクエスト</button>
  <pre id="log"></pre>

  <script type="module">
    import { requestNotificationPermission } from "./src/utils/requestNotificationPermission.js";

    const log = (msg) => {
      document.getElementById("log").textContent += msg + "\n";
    };

    document.getElementById("btn").addEventListener("click", async () => {
      log("⏳ Service Worker 登録中...");
      try {
        const registration = await navigator.serviceWorker.register("/big/service-worker.js");
        log("✅ Service Worker 登録成功");

        const result = await requestNotificationPermission(registration);

        if (result?.error) {
          log("❌ エラー: " + result.error);
        } else if (result?.subscription) {
          log("✅ 通知購読成功");
          log(JSON.stringify(result.subscription, null, 2));  // ← ここで中身出す
        } else {
          log("⚠️ 不明な戻り値: " + JSON.stringify(result));
        }

      } catch (err) {
        log("❌ 例外発生: " + err.message);
      }
    });
  </script>
</body>
</html>
