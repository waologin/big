<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>QR Utils テスト</title>
  <style>
    body {
      font-family: monospace;
      background: #111;
      color: #eee;
      padding: 20px;
    }
    #log {
      background: #222;
      border-radius: 8px;
      padding: 10px;
      max-height: 70vh;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    img {
      display: block;
      margin-top: 12px;
      border: 1px solid #444;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #666;
    }
  </style>
</head>
<body>
  <h2>🧩 QR Utils テスト</h2>
  <div id="log"></div>
  <button id="testBtn">QRテスト実行</button>
  <div id="result"></div>

  <script type="module">
    import * as qr from "./src/utils/qrUtils.js";

    const logBox = document.getElementById("log");
    const resultBox = document.getElementById("result");

    function log(msg, type = "info") {
      const now = new Date().toLocaleTimeString("ja-JP", { hour12: false });
      const color =
        type === "error" ? "#f55" :
        type === "warn" ? "#ffb400" :
        "#0f0";
      logBox.innerHTML += `<span style="color:${color}">[${now}] ${msg}</span><br>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    document.getElementById("testBtn").addEventListener("click", async () => {
      log("🚀 QRテスト開始");

      try {
        // テストデータ
        const data = { name: "TestUser", key: "12345", time: Date.now() };

        // QR生成
        log("📤 QR生成中...");
        const url = await qr.generateConnectionQR(data);
        log("✅ QR生成成功");

        const img = document.createElement("img");
        img.src = url;
        img.width = 200;
        resultBox.innerHTML = "";
        resultBox.appendChild(img);

        // 復号テスト
        log("🔄 復号テスト中...");
        const qrText = btoa(JSON.stringify(data));
        const decoded = qr.parseConnectionQR(qrText);
        log(`📦 復号結果: ${JSON.stringify(decoded, null, 2)}`);

        log("🎉 テスト完了！");
      } catch (err) {
        log(`❌ エラー発生: ${err.message}`, "error");
        console.error(err);
      }
    });
  </script>
</body>
</html>
