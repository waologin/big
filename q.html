<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>QR Utils テスト</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #111;
      color: #eee;
      margin: 20px;
      padding: 20px;
    }
    button {
      padding: 10px 16px;
      margin: 5px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #0078d7;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #005ea3;
    }
    #log {
      background: #222;
      padding: 10px;
      margin-top: 15px;
      height: 240px;
      overflow-y: auto;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
    img {
      display: block;
      margin-top: 10px;
      max-width: 300px;
      background: white;
      border-radius: 6px;
      padding: 4px;
    }
  </style>
</head>
<body>
  <h1>🧩 QR Utils テスト</h1>
  <button id="genBtn">QR生成テスト</button>
  <button id="decodeBtn">QR解析テスト</button>
  <div id="output">
    <img id="qrImage" src="" alt="QRコード" />
  </div>
  <div id="log"></div>

  <script type="module">
    import {
      generateConnectionQR,
      decodeFromQR,
      parseConnectionQR
    } from "./qrUtils.js";

    const logBox = document.getElementById("log");
    const qrImage = document.getElementById("qrImage");

    function log(msg, type = "info") {
      const time = new Date().toLocaleTimeString();
      const prefix =
        type === "error" ? "❌" :
        type === "warn" ? "⚠️" :
        type === "ok" ? "✅" :
        "ℹ️";
      logBox.textContent += `[${time}] ${prefix} ${msg}\n`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    document.getElementById("genBtn").addEventListener("click", async () => {
      log("🚀 テスト開始 (QR生成)");
      try {
        const data = { user: "test", id: Date.now() };
        const url = await generateConnectionQR(data);
        qrImage.src = url;
        log(`✅ 生成成功: ${url.substring(0, 60)}...`, "ok");
      } catch (err) {
        log(`❌ 生成エラー: ${err.message}`, "error");
      }
    });

    document.getElementById("decodeBtn").addEventListener("click", async () => {
      log("🔍 テスト開始 (QR解析)");
      try {
        if (!qrImage.src) {
          log("⚠️ QR画像がありません。先に生成してください。", "warn");
          return;
        }
        const qrData = await decodeFromQR(qrImage);
        log(`📦 QR中データ(raw): ${qrData}`);
        const obj = parseConnectionQR(qrData);
        log(`✅ 復号結果: ${JSON.stringify(obj)}`, "ok");
      } catch (err) {
        log(`❌ 解析エラー: ${err.message}`, "error");
      }
    });

    log("✅ ページロード完了。準備OK。");
  </script>
</body>
</html>
